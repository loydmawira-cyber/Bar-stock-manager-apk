name: Build and Release APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ./debug.keystore
            echo "Restored persistent keystore from repository secret"
          elif [ -f "./debug.keystore.base64" ]; then
            base64 -d ./debug.keystore.base64 > ./debug.keystore
            echo "Restored persistent keystore from debug.keystore.base64 file"
          else
            echo "Restoring permanent embedded keystore to prevent signature conflict"
            cat << 'EOF' | base64 -d > ./debug.keystore

EOF
          fi
          echo "Verified restored keystore signature:"
          keytool -list -v -keystore ./debug.keystore -storepass android -alias androiddebugkey | grep SHA256

      - name: Build APKs (Debug and Release)
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: androiddebugkey
        run: |
          VERSION_NUM=$((100 + ${{ github.run_number }}))
          echo "Building APKs with versionCode=$VERSION_NUM"
          gradle :app:assembleDebug :app:assembleRelease -PSTORE_PASSWORD=android -PKEY_PASSWORD=android -PKEY_ALIAS=androiddebugkey -PVERSION_CODE=$VERSION_NUM --stacktrace --no-daemon

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_assets
        run: |
          TEMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/release/app-release.apk "$TEMP_DIR/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/app-debug.apk"
          echo "RELEASE_APK=$TEMP_DIR/app-release.apk" >> $GITHUB_OUTPUT
          echo "DEBUG_APK=$TEMP_DIR/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APKs to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_APK="${{ steps.prepare_assets.outputs.RELEASE_APK }}"
          DEBUG_APK="${{ steps.prepare_assets.outputs.DEBUG_APK }}"
          RELEASE_TAG="v1.4-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Release v1.4 (Build #${{ github.run_number }})"
          
          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$DEBUG_APK" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Bar Stock Manager v1.4 (versionCode $((100 + ${{ github.run_number }}))). Includes signed app-release.apk and app-debug.apk."
